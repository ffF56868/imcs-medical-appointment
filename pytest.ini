[pytest]
pythonpath = .
testpaths = tests

# 旧 RAG 系统的测试已隔离到 tests/legacy：它们依赖 MySQL + Milvus，
# 且是同步 SQLModel 风格，与 IMCS 的 PostgreSQL/pgvector + 异步栈不兼容。
# 默认不收集——否则 pytest 会为每个用例加载 legacy/conftest.py，
# 进而 import app.vector_store / app.llm_factory 去连 Milvus，
# 而 IMCS 容器栈里根本没有 Milvus 服务，所有用例都会卡在连接超时上。
# 需要跑旧测试时显式指定路径：pytest tests/legacy
addopts = --ignore=tests/legacy

# IMCS 测试大量使用 async def 测试函数与异步 fixture（httpx.AsyncClient），
# 不显式声明模式的话 pytest-asyncio 不会接管协程，用例会被静默跳过
# （表现为 "N passed" 但实际一个断言都没跑）。auto 模式同时兼容
# 显式 @pytest.mark.asyncio 写法。
asyncio_mode = auto

# 固定 fixture 事件循环作用域，消除 pytest-asyncio 0.24+ 的未设置警告。
# 用 function 而非 session：每个用例独立事件循环，避免用例间共享
# AsyncClient / 数据库会话产生的隐式耦合。
asyncio_default_fixture_loop_scope = function
