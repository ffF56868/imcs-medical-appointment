# ============================================================
# IMCS 站点配置
# ============================================================

# Docker 内置 DNS。容器重建会换 IP，而 upstream 块里的主机名只在 nginx
# **启动时**解析一次，之后不再更新——实测中重建 api 容器后 nginx 仍连旧 IP，
# 全部 /api 请求返回 502（Connection refused），必须重启 nginx 才恢复。
# 生产环境滚动更新时这会直接造成服务中断，因此改为运行时解析。
# 127.0.0.11 是 Docker 为每个网络提供的嵌入式 DNS，非本机回环服务。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    # 用变量承载上游地址：proxy_pass 里含变量时，nginx 才会在**每次请求时**
    # 走 resolver 重新解析，而不是启动时固化一个 IP。
    # 代价是失去 upstream 块的长连接池（keepalive），对本项目的请求量可忽略；
    # 换来的是后端容器可随意重建而网关无需重启。
    set $imcs_api_backend "api:8010";

    # ---------- 安全响应头 ----------
    # 刻意**不在 server 级设置**：server 级 add_header 会作用到所有 location，
    # 而 /api/ 的响应由后端中间件已经设过一遍（见 imcs_main.add_security_headers），
    # 两层叠加会产生 "nosniff, nosniff" 这样的重复头（实测已复现）。
    # 因此只在静态资源 location 内单独设置——静态文件不经后端，不设就没有保护。
    # 医疗系统含个人健康信息，安全头必须齐全，但只能设一遍。

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Nginx 自身健康检查 ----------
    # 供 compose healthcheck 使用，不打到后端，避免后端抖动时
    # nginx 也被判定为不健康而陷入级联重启
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        # 后端路由前缀就是 /api/v1/...，与网关对外路径一致，因此原样透传。
        # 必须显式带 $request_uri：proxy_pass 使用变量时，nginx 不再自动
        # 拼接请求 URI，漏写会导致后端只收到 "/" 而全部 404。
        proxy_pass http://$imcs_api_backend$request_uri;

        proxy_http_version 1.1;
        # 动态解析模式下没有 upstream 连接池可复用，此头仅用于避免
        # 默认的 "Connection: close" 干扰长连接与 SSE
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For：api 侧 deps.py 的 get_client_ip 会读它的首段
        # 用于登录限流与审计，因此必须透传真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE 流式对话关键配置 ----------
        # proxy_buffering off：不关闭的话 nginx 会把 token 攒在缓冲区里，
        # 等响应结束一次性吐出，打字机效果完全消失
        # cache off：同理，禁止缓存流式响应
        # chunked_transfer_encoding on：SSE 依赖分块传输
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 流式对话可能持续数分钟（长报告解读），默认 60s 会中途断流。
        # 300s 上限与 LLM 服务层的超时预算相匹配
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ---------- OpenAPI 文档 ----------
    # 开发阶段直接放行，便于用 Swagger 调接口。生产环境收紧的做法：
    # imcs_main.py 已在 environment=production 时把 docs_url / openapi_url
    # 置为 None，后端本身不再提供这些端点，此处无需重复控制
    location ~ ^/api/(docs|redoc|openapi.json) {
        proxy_pass http://$imcs_api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 前端静态资源 ----------
    # Vue 构建产物的哈希文件名可长期缓存；index.html 必须不缓存，
    # 否则前端发新版后用户会一直拿到旧的入口文件，导致资源 404。
    # 安全头必须逐个 location include：add_header 不跨层继承，
    # 详见 security-headers.inc 的说明。
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
}
