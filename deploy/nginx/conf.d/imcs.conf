# ============================================================
# IMCS 站点配置
# ============================================================

# FastAPI 上游。用 upstream 块而非直接写地址，便于后续加多副本与权重
upstream imcs_api {
    server api:8010;
    # 与 api 服务的 --workers 数量无关：uvicorn 多 worker 共享同一个监听端口，
    # 这里只需要一个 server 条目
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ---------- 安全响应头 ----------
    # 医疗系统含个人健康信息，安全头必须齐全
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 禁用摄像头/麦克风/定位。分诊与问答均不需要这些能力，
    # 关闭可阻断恶意知识文档中嵌入的探测脚本
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Nginx 自身健康检查 ----------
    # 供 compose healthcheck 使用，不打到后端，避免后端抖动时
    # nginx 也被判定为不健康而陷入级联重启
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        # 去掉 /api 前缀再转发：后端路由是 /api/v1/... 还是 /v1/...
        # 由后端决定，这里保留完整路径透传，避免两处前缀规则不一致
        proxy_pass http://imcs_api;

        proxy_http_version 1.1;
        # 清空 Connection 头以启用 upstream keepalive
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For：api 侧 deps.py 的 get_client_ip 会读它的首段
        # 用于登录限流与审计，因此必须透传真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE 流式对话关键配置 ----------
        # proxy_buffering off：不关闭的话 nginx 会把 token 攒在缓冲区里，
        # 等响应结束一次性吐出，打字机效果完全消失
        # cache off：同理，禁止缓存流式响应
        # chunked_transfer_encoding on：SSE 依赖分块传输
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 流式对话可能持续数分钟（长报告解读），默认 60s 会中途断流。
        # 300s 上限与 LLM 服务层的超时预算相匹配
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ---------- OpenAPI 文档 ----------
    # 生产环境应关闭或加访问控制，这里通过 IMCS_ENVIRONMENT 之外的
    # 手段留待部署时处理：开发阶段直接放行，便于用 Swagger 调接口
    location ~ ^/api/(docs|redoc|openapi.json) {
        proxy_pass http://imcs_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 前端静态资源 ----------
    # Vue 构建产物的哈希文件名可长期缓存；index.html 必须不缓存，
    # 否则前端发新版后用户会一直拿到旧的入口文件，导致资源 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
}
