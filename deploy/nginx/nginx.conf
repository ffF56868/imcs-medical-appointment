# ============================================================
# IMCS Nginx 主配置
# ============================================================
# 职责：对外只暴露 80 端口，同时承担
#   1. 前端静态资源服务（阶段 7 的 Vue 构建产物）
#   2. /api 反向代理到 FastAPI
#   3. SSE 流式对话透传（关键：必须关闭 proxy_buffering）
#
# 为什么不让 api 容器直接对外暴露端口：
# 前后端同源可彻底避免 CORS 与跨域 Cookie 问题；
# 生产环境只需在这一层加 HTTPS，业务容器无需感知 TLS。
# ============================================================

user nginx;
# auto 按宿主机 CPU 核数决定 worker 数。AI 服务是 IO 密集，
# 这里不是瓶颈，瓶颈在上游 LLM 与数据库
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 单 worker 最大连接数。SSE 是长连接，并发对话多时连接数会持续占用，
    # 因此给到 4096 而非常见的 1024
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 上传检查报告 PDF 等文件，放宽到 50MB。
    # 旧系统单文件上限 5MB、批量 20MB，这里留出余量
    client_max_body_size 50m;

    # gzip 只对文本类生效。向量与二进制文件压缩无意义且耗 CPU
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
